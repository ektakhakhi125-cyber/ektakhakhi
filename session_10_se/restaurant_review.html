<!DOCTYPE html>

<html>
<head>

```
<title>Restaurant Review</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
```

</head>

<body>

```
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4">

                <h2 class="mb-4">
                    Restaurant Review
                </h2>

                <form>

                    <!-- Name -->
                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label">

                            Your Name

                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- Rating -->
                    <div class="mb-3">

                        <label
                            for="rating"
                            class="form-label">

                            Rating

                        </label>

                        <select
                            id="rating"
                            class="form-select"
                            required>

                            <option value="">
                                Select rating
                            </option>

                            <option value="5">
                                ⭐⭐⭐⭐⭐ 5 Stars
                            </option>

                            <option value="4">
                                ⭐⭐⭐⭐ 4 Stars
                            </option>

                            <option value="3">
                                ⭐⭐⭐ 3 Stars
                            </option>

                            <option value="2">
                                ⭐⭐ 2 Stars
                            </option>

                            <option value="1">
                                ⭐ 1 Star
                            </option>

                        </select>

                    </div>


                    <!-- Review -->
                    <div class="mb-3">

                        <label
                            for="review"
                            class="form-label">

                            Your Review

                        </label>

                        <textarea
                            id="review"
                            class="form-control"
                            rows="5"
                            minlength="20"
                            placeholder="Write your review..."
                            required>
                        </textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-danger">

                        Submit Review

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
```

</body>
</html>
