<!DOCTYPE html>

<html>
<head>
    <title>Spotify Playlist</title>

```
<style>
    .playlist {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 20px;
        background-color: #181818;
    }

    .song-card {
        width: 180px;
        height: 80px;
        padding: 10px;
        background-color: #282828;
        color: white;

        display: flex;
        align-items: center;
    }

    .song-name {
        font-weight: bold;
    }

    .artist {
        font-size: 14px;
        margin-top: 5px;
        color: #cccccc;
    }
</style>
```

</head>

<body>

```
<h1>My Playlist</h1>

<div class="playlist">

    <div class="song-card">

    </div>

    <div class="song-card">
        <div>
            <div class="song-name">Believer</div>
            <div class="artist">Imagine Dragons</div>

    </div>

</div>
```

</body>
</html>
