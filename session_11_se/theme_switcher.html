<!DOCTYPE html>

<html>
<head>

```
<title>Theme Switcher</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
```

</head>

<body>

```
<main
    id="mainContainer"
    class="bg-light text-dark min-vh-100 p-5">

    <div class="container">

        <h1 class="fw-bold">
            Movie Details
        </h1>

        <p class="lead">
            Avengers: Endgame
        </p>

        <p>
            ⭐ 4.5/5
        </p>

        <p>
            Enjoy the latest movie experience.
        </p>

        <button
            id="themeButton"
            class="btn btn-dark">

            Switch to Dark Mode

        </button>

    </div>

</main>


<script>

    const mainContainer =
        document.getElementById("mainContainer");

    const themeButton =
        document.getElementById("themeButton");


    themeButton.addEventListener("click", function() {

        // Switch background
        mainContainer.classList.toggle("bg-light");
        mainContainer.classList.toggle("bg-dark");

        // Switch text color
        mainContainer.classList.toggle("text-dark");
        mainContainer.classList.toggle("text-light");


        // Change button text
        if (mainContainer.classList.contains("bg-dark")) {

            themeButton.textContent =
                "Switch to Light Mode";

            themeButton.classList.remove("btn-dark");
            themeButton.classList.add("btn-light");

        } else {

            themeButton.textContent =
                "Switch to Dark Mode";

            themeButton.classList.remove("btn-light");
            themeButton.classList.add("btn-dark");

        }

    });

</script>
```

</body>
</html>
