<!DOCTYPE html>

<html>
<head>

```
<title>Bootstrap Spacing</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
```

</head>

<body>

```
<div class="container mt-5">

    <h1 class="text-center mb-5">
        Product Spacing Demo
    </h1>

    <!-- Level 1: Small spacing -->
    <div class="m-2 p-2 bg-light border rounded">

        <div class="card">

            <img
                src="https://via.placeholder.com/300"
                class="card-img-top"
                alt="Smartphone">

            <div class="card-body">

                <h5 class="card-title">
                    Level 1 Product
                </h5>

            </div>

        </div>

    </div>


    <!-- Level 2: Medium spacing -->
    <div class="m-4 p-4 bg-light border rounded">

        <div class="card">

            <img
                src="https://via.placeholder.com/300"
                class="card-img-top"
                alt="Laptop">

            <div class="card-body">

                <h5 class="card-title">
                    Level 2 Product
                </h5>

            </div>

        </div>

    </div>


    <!-- Level 3: Large spacing -->
    <div class="m-5 p-5 bg-light border rounded">

        <div class="card">

            <img
                src="https://via.placeholder.com/300"
                class="card-img-top"
                alt="Headphones">

            <div class="card-body">

                <h5 class="card-title">
                    Level 3 Product
                </h5>

            </div>

        </div>

    </div>

</div>
```

</body>
</html>
