<!DOCTYPE html>

<html>
<head>
    <title>Bootstrap Product Cards</title>

```
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
```

</head>

<body>

```
<div class="container mt-5">

    <h1 class="text-center mb-4">
        Products
    </h1>

    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-md-4">

            <div class="card h-100">

                <img
                    src="https://via.placeholder.com/300"
                    class="card-img-top"
                    alt="Laptop">

                <div class="card-body">

                    <h5 class="card-title">
                        Laptop
                    </h5>

                    <p class="card-text">
                        Powerful laptop for work and entertainment.
                    </p>

                    <p class="fw-bold">
                        ₹45,999
                    </p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <!-- Product 2 -->
        <div class="col-md-4">

            <div class="card h-100">

                <img
                    src="https://via.placeholder.com/300"
                    class="card-img-top"
                    alt="Smartphone">

                <div class="card-body">

                    <h5 class="card-title">
                        Smartphone
                    </h5>

                    <p class="card-text">
                        Modern smartphone with a great display.
                    </p>

                    <p class="fw-bold">
                        ₹24,999
                    </p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <!-- Product 3 -->
        <div class="col-md-4">

            <div class="card h-100">

                <img
                    src="https://via.placeholder.com/300"
                    class="card-img-top"
                    alt="Headphones">

                <div class="card-body">

                    <h5 class="card-title">
                        Headphones
                    </h5>

                    <p class="card-text">
                        Wireless headphones with clear sound.
                    </p>

                    <p class="fw-bold">
                        ₹2,499
                    </p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
```

</body>
</html>
